# Production profile (Render). Activated by SPRING_PROFILES_ACTIVE=prod.
# All secrets come from environment variables set in the Render dashboard.
# The base application.properties is gitignored, so this file is the only
# config present in the deployed jar.

# Server — Render injects the PORT env var; bind to it.
server.port=${PORT:8080}

# Database (Aiven MySQL) — set these env vars in Render.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — auto-create/update tables from entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Groq API — fixed endpoint/model; key from env.
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Clerk — JWKS URL from env.
clerk.jwks.url=${CLERK_JWKS_URL}

# CORS — your deployed frontend origin(s), comma-separated.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Coding assessment service (optional; graceful fallback if unset).
coding.platform.base.url=${CODING_PLATFORM_BASE_URL:http://localhost:8081}
coding.platform.timeout.ms=${CODING_PLATFORM_TIMEOUT_MS:3000}

# Logging
logging.level.com.interview=INFO
logging.level.org.springframework.security=WARN
